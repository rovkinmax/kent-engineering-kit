model = "gpt-5.6-sol"
thinking_level = "medium"
model_verbosity = "low"
max_subagent_depth = 1

[workflow]
subagents = true
concurrency = 2

[reviewer]
frequency = "off"
model = "gpt-5.6-terra"
thinking_level = "medium"
model_verbosity = "low"

[subagents.fast]
model = "gpt-5.6-luna"
thinking_level = "low"
model_verbosity = "low"
priority_request_mode = false
model_context_window = 372000

[subagents.compliance_reviewer]
description = "Agent for reviewing code, plans, documents, diffs, or other scopes only for compliance with applicable specifications and AGENTS.md rules. Cannot edit files."
model = "gpt-5.6-terra"
system_prompt_file = "agents/compliance_reviewer.md"
thinking_level = "medium"
model_verbosity = "low"
agent_callable = false
workflow_subagent = false

[subagents.compliance_reviewer.tools]
shell = true
patch = false
edit = false

[subagents.compliance_reviewer.skills]
planning = false

[subagents.researcher]
description = "Read-only primary-source research for technical and product questions."
model = "gpt-5.6-terra"
system_prompt_file = "agents/researcher.md"
thinking_level = "medium"
model_verbosity = "low"
agent_callable = true
workflow_subagent = true

[subagents.researcher.tools]
shell = true
patch = false
edit = false

[subagents.standards-reviewer]
description = "Read-only review against repository instructions, architecture, and engineering standards."
model = "gpt-5.6-sol"
system_prompt_file = "agents/standards-reviewer.md"
thinking_level = "medium"
model_verbosity = "low"
agent_callable = false
workflow_subagent = false

[subagents.standards-reviewer.tools]
shell = true
patch = false
edit = false

[subagents.spec-reviewer]
description = "Read-only review of a change against its specification and acceptance criteria."
model = "gpt-5.6-sol"
system_prompt_file = "agents/spec-reviewer.md"
thinking_level = "medium"
model_verbosity = "low"
agent_callable = false
workflow_subagent = false

[subagents.spec-reviewer.tools]
shell = true
patch = false
edit = false

[subagents.architecture-designer]
description = "Read-only design of alternative module interfaces, seams, and migration strategies."
model = "gpt-5.6-sol"
system_prompt_file = "agents/architecture-designer.md"
thinking_level = "high"
model_verbosity = "low"
agent_callable = true
workflow_subagent = true

[subagents.architecture-designer.tools]
shell = true
patch = false
edit = false
